<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, intital-scale=1.0">
    <title>Game Merchant | Support</title>
    <meta name="Description" content="Contact us for any enquiries.">
    <link rel="stylesheet" href="css\global.css">
    <link rel="stylesheet" href="css\contact.css">
</head>
<body>
    <header class="site-header"> 
        <nav aria-label="Primary">
            <a class="logo" href="index.html">
                <img src="images/Logo.jpg" alt="logo" width="55">
            </a>  
            <ul><a href="index.html">Home</a></ul>
            <ul><a href="about.html">About</a></ul>
            <ul><a href="products.html">Products</a></ul>
            <ul><a href="checkout.html">Checkout</a></ul>
            <ul><a class="active" href="contact.html">Contact</a></ul>
        </nav>
    </header>
    <h1>Support</h1>
    <hr>
    <section>
        <p>Contact Our Support</p>
        <p class="contact-details">
        Email: support@example.example &nbsp;|&nbsp; Phone: 0494 688 274
        </p>
    </section>
    <section>
        <form action="#" method="post">
            <fieldset>
                <legend>Open a Ticket</legend>
                <div class="form-grid">
                    <div class="field-group">
                        <label for="contact_name">Your Name</label>
                        <input type="text" id="contact_name" name="contact_name"
                        placeholder="e.g. John Smith" required>
                    </div>
                    <div class="field-group">
                        <label for="contact_email">Your Email</label>
                        <input type="email" id="contact_email" name="contact_email"
                        placeholder="you@email.com" required>
                    </div>
                    <div class="field-group full">
                        <label for="contact_message">Your Message</label>
                        <textarea id="contact_message" name="contact_message"
                        placeholder="e.g. " required></textarea>
                    </div>
                </div>
                <div class="actions">
                <button type="submit">Send Request</button>
                <button type="reset">Clear Message</button>
                </div>
            </fieldset>
        </form>
    </section>
</body>

</html>
